global:
  device: cuda
  seeds:
    - 12
    - 35
    - 71
    - 123
    - 2025
  results_dir: results
  figures_dir: figures
  use_wandb: false
model:
  name: vit_base_patch16_224.augreg_in21k_ft_in1k
  use_grad_checkpointing: true
  adapter:
    type: SALoRA
    rank: 4
    target_modules:
      - qkv
      - proj
optimizer:
  name: AdamW8bit
  lr: 0.0003
  betas:
    - 0.9
    - 0.95
  weight_decay: 0.01
  grad_norm_clip: 1.0
training:
  precision: bf16
  batch_size: 32
exp1:
  name: End-to-End Continual-Learning Benchmark
  datasets:
    split_cifar100:
      n_experiences: 10
      epochs: 1
    permutted_mnist:
      n_experiences: 20
      steps: 2000
    split_tiny_imagenet:
      n_experiences: 20
      epochs: 1
  baselines:
    - RL-TOP
    - Random
    - Similarity-Greedy
    - DER
    - EWC
  rl_top:
    window_size: 4
    hidden_size: 128
    update_every: 100
  der:
    mem_size: 500
  ewc:
    ewc_lambda: 100.0
exp2:
  name: Ablation of Dual Metrics & RL Policy
  dataset:
    name: split_cifar100
    n_experiences: 10
    epochs: 1
  variants:
    - RL-TOP (S+G)
    - RL-TOP (S-only)
    - RL-TOP (G-only)
    - Heuristic-TOP (Greedy G)
  rl_top:
    window_size: 4
    hidden_size: 128
    update_every: 100
    gamma: 0.99
exp3:
  name: Robustness to Fuzzy Task Boundaries
  dataset:
    name: cifar100_blur
    window_width: 20
    shift_every_steps: 200
    n_pseudo_tasks: 50
    boundary_lambda: 800
  batch_size: 64
  baselines:
    - RL-TOP
    - MIR
    - ER
    - DER++
    - Random
  replay_mem_size: 1000
  noise_injection:
    p: 0.2
    sigma: 0.1
    duration_steps: 2000
