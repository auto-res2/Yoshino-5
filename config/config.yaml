# Top-level switches for which experiments to run
run_experiment1: true
run_experiment2: true
run_experiment3: true
run_baseline_lora: true

# Experiment 1 configuration (robustness/calibration/communication)
exp1:
  seed: 42
  num_clients: 12
  total_samples: 1200
  num_classes: 6
  n_rounds: 8
  local_epochs: 1
  batch_size: 16
  embed_dim: 64
  n_anchors: 32
  adapter_type: spectral  # spectral or lora
  lr: 0.002
  weight_decay: 0.01
  beta_fusion: 4.0
  lambda_ot: 0.2
  lambda_infonce: 0.2
  svd_rank: 8
  q_fdr: 0.1

# Experiment 2 configuration (alignment & retrieval)
exp2:
  seed: 123
  num_clients: 12
  total_samples: 1200
  num_classes: 6
  n_rounds: 6
  local_epochs: 1
  batch_size: 16
  embed_dim: 64
  n_anchors: 32
  adapter_type: spectral
  lr: 0.002
  weight_decay: 0.01
  beta_fusion: 4.0
  lambda_ot: 0.5
  lambda_infonce: 0.2
  svd_rank: 8

# Experiment 3 configuration (reliability & communication)
exp3:
  seed: 7
  num_clients: 12
  total_samples: 1200
  num_classes: 6
  n_rounds: 10
  local_epochs: 1
  batch_size: 16
  embed_dim: 64
  n_anchors: 32
  adapter_type: spectral
  lr: 0.002
  weight_decay: 0.01
  beta_fusion: 4.0
  lambda_ot: 0.2
  lambda_infonce: 0.2
  svd_rank: 8
  svd_rank_list: [4, 8, 16]
  q_list: [0.05, 0.1, 0.2]
  faulty_frac: 0.2
