experiment_name: 'exp2_split_cifar100'
description: 'Full Split-CIFAR-100 benchmark to reproduce headline claims.'
dataset: 'split_cifar100'
seeds: [12, 35, 71, 123, 2025]
policies: ['random', 'similarity_greedy', 'er_500', 'rl_top']
device: 'cuda'
log_to_wandb: false

# Dataset
num_tasks: 10
classes_per_task: 5
dataset_root: './data'

# Model
model_name: 'vit_base_patch16_224.augreg_in21k_ft_in1k'
salora_rank: 4
salora_alpha: 16
salora_dropout: 0.1

# Training
epochs_per_task: 1
train_batch_size: 32
eval_batch_size: 128
grad_accum_steps: 4
optimizer: 'AdamW8bit' # Use 8-bit optimizer
lr: 0.0003
betas: [0.9, 0.95]
weight_decay: 0.01
clip_grad_norm: 1.0
precision: 'bf16'

# RL-TOP
search_window_m: 4
actor_critic_hidden_dim: 128
a2c_gamma: 0.99
exploration_eps_start: 0.4
exploration_eps_end: 0.05

# Baselines
er_buffer_size: 500

# Validation
results_gate:
  aacc_min: 75.0
  af_max: 8.0
