SYSTEM:
  device: cuda
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  seeds: [11, 23, 42]
  results_dir: results

DATA:
  streams:
    - name: SplitCIFAR100
      provider: avalanche.benchmarks.classic.split_cifar100
      n_experiences: 20
      orderings: [random, semantic, hard]
      batch_size: 64
    - name: SplitImageNetR
      provider: avalanche.benchmarks.SplitImageNetR
      n_experiences: 10
      orderings: [random, semantic, hard]
      batch_size: 64

MODEL:
  backbone: vit_base_patch16_224
  quant: true
  adapter:
    type: InfLoRA
    rank: 32
    alpha: 64
    dropout: 0.05
    nf4: true

OPTIM:
  lr: 0.0001
  weight_decay: 0.05
  epochs_per_task: 2
  grad_clip: 1.0

SCHED:
  type: GOST
  buffer_M: 4
  w_s: 2.0
  w_i: 1.0
  max_overhead: 0.05
  baselines: [random, otdd, grad, fixed, oracle]

EVAL:
  metrics: [ACC, MinACC, BWT, FWT, WF10]

VIZ:
  formats: [pdf]
