work_dir: "./runs"
device: "cuda"
seeds: [17, 42, 2025]

lr_vision: 5e-5
lr_nlp: 2e-5
betas: [0.9, 0.95]
weight_decay: 0.01
eps: 1e-8

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

curious_alpha: 0.3
curious_beta: 0.6
curious_gamma: 0.1
flops_budget_ratio: 0.03

epochs_per_task: 3
batch_size_vision: 96
batch_size_nlp: 32
precision: "fp16"

imagenette_url: "https://s3.amazonaws.com/fast-ai-imageclas/imagenette2-160.tgz"
imagenette_md5: "N/A"
imagenette_classes: 10

flan_tasks:
  - "google/boolq"
  - "stanfordnlp/sst2"
  - "glue"
  - "multi_nli"

experiments: ["exp1"]