# Default configuration (offline CLUE++)
dev_env:
  seeds: [0, 11, 21, 42, 77]
  device: cuda
  mixed_precision: true
  profiler: false

experiment:
  name: exp1_offline_clue
  alpha: 0.6          # similarity coefficient
  beta: 0.4           # gradient-conflict coefficient
  beam_size: 8        # beam width for TSP-like ordering
  lr_grid: [1e-4, 2e-4, 3e-4]
  epochs_per_task: 2
  batch_size: 8
  tasks:
    - {name: AFQMC,  hf: clue/afqmc}
    - {name: TNEWS,  hf: clue/tnews}
    - {name: CMNLI,  hf: clue/cmnli}
    - {name: IFLYTEK, hf: clue/iflytek}
    - {name: CSL,    hf: clue/csl}
    - {name: WSC,    hf: clue/cluewsc2020}
  model:
    hf_id: decapoda-research/llama-1.3b
    lora_r: 64
    lora_alpha: 32
    bnb_8bit: true
