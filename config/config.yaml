experiment_code: 'exp2_split_cifar100'
experiment_name: 'Full Split-CIFAR-100 benchmark (headline claim)'
description: 'Reproduces the headline AACC/AF claims on Split-CIFAR-100 with a ViT-Base model.'

# Execution
device: 'cuda'
# seed and policy will be set by main.py

# Dataset
dataset: 'split_cifar100'
num_tasks: 10
classes_per_task: 5
dataset_root: './data'
validation_size: 0.1

# Model (ViT-Base)
model_name: 'vit_base_patch16_224.augreg_in21k_ft_in1k'
image_size: 224
salora_rank: 4
salora_alpha: 16
salora_dropout: 0.1

# Training
epochs_per_task: 1
train_batch_size: 32
eval_batch_size: 128
optimizer: 'AdamW8bit'
lr: 0.0003
betas: [0.9, 0.95]
weight_decay: 0.01
clip_grad_norm: 1.0
precision: 'bf16'

# RL-TOP
search_window_m: 4
actor_critic_hidden_dim: 128
a2c_gamma: 0.99

# Baselines
er_buffer_size: 500
