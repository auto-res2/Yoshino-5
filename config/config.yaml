shared:
  model:
    tiny_llama_path: nickypro/tinyllama-110M
    teeny_llama_path: nicholasKluge/TeenyTinyLlama-460m
    siglip_path: google/siglip-base-patch16-224
    quant_cfg:
      load_in_8bit: true
    lora:
      rank: 4
      alpha: 16
      dropout: 0.05
  train:
    epochs: 3
    lr: 0.0002
    batch_size: 6
    grad_accum: 8
    max_seq_len: 256
    weight_decay: 0.01
    clip_grad: 1.0
    fp16: true
exp1:
  tasks:
    - ni2109
    - ni2002
  n_seeds:
    - 11
    - 29
    - 42
  lora_rank: 2
  epochs: 1
  batch_size: 8
exp2:
  run_if_env: SKIP_EXP2
  nlp_stream: cache/nl10.yaml
  cv_stream: cache/cv10.yaml
  beam: 5
exp3:
  run_if_env: SKIP_EXP3
  anti_curriculum: cache/ni8_anti.yaml
  beam: 5