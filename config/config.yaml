experiment: 'main'
seeds: [12, 35, 71, 123, 2025]
device: 'cuda'
log_to_wandb: false

dataset_root: './data'
num_tasks_cifar100: 10
classes_per_task_cifar100: 5

model_name: 'vit_base_patch16_224.augreg_in21k_ft_in1k'
num_classes_total: 100

salora_rank: 4
salora_alpha: 16
salora_dropout: 0.1
salora_modules: ['qkv', 'proj']

optimizer: 'AdamW8bit'
lr: 0.0003
betas: [0.9, 0.95]
weight_decay: 0.01
epochs_per_task: 1
train_batch_size: 32
eval_batch_size: 128
grad_accum_steps: 4
clip_grad_norm: 1.0
precision: 'bf16'

search_window_m: 4
actor_critic_hidden_dim: 128
a2c_gamma: 0.99
rl_actor_lr: 0.0001
rl_critic_lr: 0.0003
exploration_eps_start: 0.4
exploration_eps_end: 0.05

er_buffer_size: 500

sanity_check_threshold: 60.0
label_noise_level: 0.15

toy_epochs: 5
toy_batch_size: 64
toy_classes: ['airplane', 'bird', 'car', 'cat', 'dog', 'truck']
toy_task_split: [0, 1]
toy_success_forgetting_threshold: 20.0
toy_success_action_threshold: 0.9
